name: Deploy frontend to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_Rp9owm7UWzU5p6Guy86FbIhb
  VERCEL_PROJECT_ID: prj_hsXANk1WVaEGFzXrNeWuWRzA2wJ6

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate application build
        run: npm run build

      - name: Pull Vercel project settings
        run: npx vercel@50.28.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel output
        run: npx vercel@50.28.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel production
        run: npx vercel@50.28.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
